services:
  postgres:
    image: postgres:16
    container_name: axioma-postgres
    environment:
      POSTGRES_DB: axioma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - axioma-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axioma -d axioma"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  axioma-postgres-data: