spring:
  application:
    name: axioma
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  web:
    error:
      include-message: always
      include-binding-errors: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    ru.amigo.axioma: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: INFO

app:
  jwt:
    # Секретный ключ. Должен быть длинным (минимум 32 символа для HS256).
    # В проде его хранят в переменных окружения!
    secret: "axioma-super-secret-key-for-jwt-signing-must-be-long-enough"
    expiration-ms: 86400000 # 24 часа

springdoc:
  swagger-ui:
    persist-authorization: true